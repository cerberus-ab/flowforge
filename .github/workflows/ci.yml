name: CI

on:
    pull_request:
        branches:
            - master

jobs:
    linters:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run lint -ws

    build-packages:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            checks: write
        needs:
            - linters
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # page-trail
            - run: npm run typecheck -w @flowforge/page-trail
            - run: npm run test -w @flowforge/page-trail
            - if: ${{ !cancelled() }}
              uses: dorny/test-reporter@v3
              with:
                  name: page-trail/unit-tests
                  path: packages/page-trail/reports/unit-tests/results/junit.xml
                  reporter: jest-junit
                  fail-on-error: false
            - run: npm run build -w @flowforge/page-trail
            # contract
            - run: npm run typecheck -w @flowforge/contract
            - run: npm run build -w @flowforge/contract
            # artifacts
            - uses: actions/upload-artifact@v4
              with:
                  name: build-packages-artifacts
                  path: |
                      packages/page-trail/dist
                      packages/contract/dist

    build-apps:
        runs-on: ubuntu-latest
        needs:
            - build-packages
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - uses: actions/download-artifact@v4
              with:
                  name: build-packages-artifacts
                  path: packages
            - run: npm run typecheck -w @flowforge/backend
            - run: npm run typecheck -w @flowforge/extension
            - run: npm run build -w @flowforge/backend
            - run: npm run build -w @flowforge/extension
